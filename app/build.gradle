plugins {
    id 'com.android.application'
}

android {
    namespace 'com.borjabravo.readmoretextviewsample'
    compileSdk 35

    defaultConfig {
        applicationId 'com.borjabravo.readmoretextview'
        minSdk 14
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // These versions preserve the original API 14 minimum while removing legacy support libraries.
    implementation project(':readmoretextview')
    implementation 'androidx.appcompat:appcompat:1.3.1'
    testImplementation 'junit:junit:4.13.2'
}
